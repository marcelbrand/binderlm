name: Sync Docs to NotebookLM

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/docs/**'
      - '*.md'
      - 'binderlm.yaml'
  workflow_dispatch:

jobs:
  stitch-and-sync:
    name: Aggregate and Sync Documentation
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docs Configuration
        uses: ./
        with:
          command: validate
          config: binderlm.yaml

      - name: Aggregate and Sync to Google Drive
        uses: ./
        with:
          command: sync
          config: binderlm.yaml
          google-application-credentials-json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
